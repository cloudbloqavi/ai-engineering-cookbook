# Dependabot keeps the pieces of this repo that CAN drift up to date.
#
# This repo has no runtime dependencies — the scripts use only Node's own
# standard library. The two things that do drift are:
#   1. the GitHub Actions used by the workflows, and
#   2. the docs toolchain pinned inside .github/workflows/docs-ci.yml.
#
# Dependabot handles (1) automatically. It cannot see (2), because those
# are pinned inside `run:` shell steps — `scripts/check-toolchain.js` is
# what stops those pins from being dropped, and the version numbers are
# reviewed by hand. See docs/toolchain.md.
version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      # Matches the repo's Conventional Commits convention (CONTRIBUTING.md).
      prefix: "ci"
    labels:
      - "dependencies"
