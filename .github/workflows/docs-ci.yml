name: Docs CI

on:
  push:
    branches: ["main", "improvements/**", "docs/**", "fix/**", "feat/**", "ci/**", "chore/**"]
  pull_request:
    branches: ["main"]

jobs:
  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli

      - name: Lint all markdown files
        run: markdownlint "**/*.md" --ignore node_modules --ignore ".specify/**" --ignore ".claude/**"

  link-check:
    name: Check Internal Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install markdown-link-check
        run: npm install -g markdown-link-check

      - name: Check links in all markdown files
        run: |
          find . -name "*.md" \
            -not -path "./node_modules/*" \
            -not -path "./.specify/*" \
            -not -path "./.claude/*" \
            | xargs -I {} markdown-link-check {} \
              --config .github/mlc-config.json

  # The installers ship to macOS, Windows and Linux, and the docs give
  # per-platform commands. Prove the suite passes on all three rather than
  # assuming Linux behaviour generalises.
  unit-tests:
    name: Unit Tests (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # No dependencies to install — the suite uses node:test, built into Node.
      - name: Run the test suite
        run: npm test

  build-explorer:
    name: Build Explorer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Rebuild the explorer bundle from design/src
        run: npm run build:explorer

      # Runs on Windows too: the build must be byte-identical there, which is
      # what `.gitattributes` (eol=lf) guarantees. If someone removes it, this
      # job is what catches the regression.
      - name: Fail if the committed bundle is out of date
        shell: bash
        run: |
          if ! git diff --exit-code -- design/cookbook-explorer.html; then
            echo "::error::design/cookbook-explorer.html is stale. Run 'npm run build:explorer' and commit the result."
            exit 1
          fi

  spell-check:
    name: Spell Check (Advisory)
    runs-on: ubuntu-latest
    continue-on-error: true  # Advisory only — does not block merge
    steps:
      - uses: actions/checkout@v4

      - name: Install cspell
        run: npm install -g cspell

      - name: Spell check markdown files
        run: cspell "**/*.md" --no-progress --config .github/cspell.json
